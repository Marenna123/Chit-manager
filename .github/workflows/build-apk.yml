name: Build and Release APK

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Restore Keystore and Environment
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore || true
        fi
        if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
        fi
        touch .env

    - name: Build Debug APK
      run: gradle :app:assembleDebug --stacktrace

    - name: Prepare APK File
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Cheeti-v1.0-debug.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cheeti-v1.0-debug
        path: app/build/outputs/apk/debug/Cheeti-v1.0-debug.apk
        retention-days: 30

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      continue-on-error: true
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
      with:
        tag_name: v1.0.0
        name: "Cheeti App v1.0.0 (Debug APK)"
        body: |
          ### Cheeti (Chit Fund Manager) Android APK
          Download and install the APK on any Android phone or tablet to test and share with customers:
          - **File:** `Cheeti-v1.0-debug.apk`
          - **Version:** 1.0.0
        files: app/build/outputs/apk/debug/Cheeti-v1.0-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
